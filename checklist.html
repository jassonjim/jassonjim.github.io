<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Checklist en estilo terminal: título, secciones y tareas con checkmarks, con descarga a .md. Modo claro y oscuro automático.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EAEBE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080B09" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20rx='2'%20fill='%23080b09'/%3E%3Cpath%20d='M3.4%208.3l2.7%202.7%206-6'%20fill='none'%20stroke='%233fd37e'%20stroke-width='2'%20stroke-linecap='square'/%3E%3C/svg%3E">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>chk.md — checklist a markdown</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Martian+Mono:wght@400;600&display=swap">
<style>
  :root{
    --bg:#EAEBE4;
    --panel:#E0E2D9;
    --ink:#161C18;
    --dim:#5C6761;
    --faint:#9AA296;
    --rule:#C7CCC0;
    --accent:#0C7A44;
    --accent-soft:rgba(12,122,68,.10);
    --warn:#9E3418;
    --glow:none;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --wide:"Martian Mono","JetBrains Mono",ui-monospace,monospace;
    --gut:3.4ch;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#080B09;
      --panel:#0E1310;
      --ink:#CBD6CC;
      --dim:#718075;
      --faint:#333C35;
      --rule:#1B221D;
      --accent:#3FD37E;
      --accent-soft:rgba(63,211,126,.13);
      --warn:#E0663F;
      --glow:0 0 12px rgba(63,211,126,.28);
    }
  }
  :root[data-theme="dark"]{
    --bg:#080B09;
    --panel:#0E1310;
    --ink:#CBD6CC;
    --dim:#718075;
    --faint:#333C35;
    --rule:#1B221D;
    --accent:#3FD37E;
    --accent-soft:rgba(63,211,126,.13);
    --warn:#E0663F;
    --glow:0 0 12px rgba(63,211,126,.28);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    font-size:clamp(11px,calc(9.6px + 0.57vw),14px);
    line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  ::selection{background:var(--accent);color:var(--bg)}

  .term{
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    max-width:60ch;
    margin:0 auto;
    border-inline:1px solid var(--rule);
  }
  @media (max-width:62ch){.term{border-inline:0}}

  /* ── bars ─────────────────────────────── */
  .bar{
    display:flex;
    align-items:center;
    gap:.6ch;
    flex-wrap:wrap;
    padding:.45rem .6rem;
    background:var(--panel);
    border-bottom:1px solid var(--rule);
    font-family:var(--wide);
    font-size:.78em;
    letter-spacing:-.02em;
  }
  .bar--btm{
    border-bottom:0;
    border-top:1px solid var(--rule);
    position:sticky;
    bottom:0;
    font-family:var(--mono);
    font-size:.85em;
    letter-spacing:0;
  }
  .name{
    color:var(--accent);
    text-shadow:var(--glow);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:0 1 auto;
    min-width:4ch;
  }
  .caret{color:var(--accent);animation:blink 1.15s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .spacer{flex:1 1 auto;min-width:0}
  .count{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .meter{letter-spacing:-.02em;white-space:nowrap}
  #mFill{color:var(--accent);text-shadow:var(--glow)}
  #mRest{color:var(--faint)}
  @media (max-width:22rem){.meter{display:none}}

  /* ── buffer ───────────────────────────── */
  .buf{
    flex:1 1 auto;
    padding:.5rem 0 1.6rem;
    display:flex;
    flex-direction:column;
  }
  .line{
    display:flex;
    align-items:flex-start;
    gap:0;
    padding:.12rem .6rem;
    border-left:2px solid transparent;
  }
  .line:focus-within{background:var(--accent-soft);border-left-color:var(--accent)}
  .tok{
    flex:0 0 var(--gut);
    width:var(--gut);
    color:var(--faint);
    -webkit-user-select:none;
    user-select:none;
    font-size:.95em;
    padding-top:.05em;
  }
  .txt{
    flex:1 1 auto;
    min-width:0;
    overflow-wrap:anywhere;
    outline:none;
    caret-color:var(--accent);
  }
  .txt:empty::before{content:attr(data-ph);color:var(--faint);text-shadow:none}
  .txt:focus-visible{outline:none}

  .line--h1{padding-top:.7rem;padding-bottom:.5rem}
  .line--h1 .txt{
    font-family:var(--wide);
    font-size:1.18em;
    font-weight:600;
    letter-spacing:-.03em;
    line-height:1.3;
    color:var(--ink);
  }
  .line--h1 .tok{color:var(--accent);text-shadow:var(--glow)}

  .line--h2{margin-top:.9rem}
  .line--h2 .txt{
    font-family:var(--wide);
    font-size:.8em;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--accent);
    text-shadow:var(--glow);
  }
  .line--h2 .tok{color:var(--accent);opacity:.55}
  .buf > .line--h2:first-of-type{margin-top:.3rem}

  .box{
    all:unset;
    flex:0 0 var(--gut);
    width:var(--gut);
    color:var(--dim);
    cursor:pointer;
    -webkit-user-select:none;
    user-select:none;
    font:inherit;
    font-size:.95em;
    padding-top:.05em;
  }
  .box:hover{color:var(--accent)}
  .box[aria-checked="true"]{color:var(--accent);text-shadow:var(--glow)}
  .line--done .txt{
    color:var(--dim);
    text-decoration:line-through;
    text-decoration-color:var(--faint);
    text-decoration-thickness:1px;
  }

  .kill{
    all:unset;
    flex:0 0 auto;
    cursor:pointer;
    color:var(--faint);
    padding:0 0 0 .8ch;
    font:inherit;
    opacity:0;
    transition:opacity .12s;
  }
  .line:hover .kill,.line:focus-within .kill{opacity:1}
  .kill:hover{color:var(--warn)}
  @media (hover:none){.kill{opacity:.5}}

  /* ── buttons ──────────────────────────── */
  .btn{
    all:unset;
    cursor:pointer;
    font:inherit;
    color:var(--dim);
    border:1px solid var(--rule);
    padding:.12rem .55ch;
    white-space:nowrap;
    transition:color .12s,border-color .12s,background .12s;
  }
  .btn:hover{color:var(--accent);border-color:var(--accent)}
  .btn--go{color:var(--accent);border-color:var(--accent)}
  .btn--go:hover{background:var(--accent);color:var(--bg);text-shadow:none}
  .btn--warn:hover{color:var(--warn);border-color:var(--warn)}
  :focus-visible{outline:1px solid var(--accent);outline-offset:2px}

  .out{
    padding:.1rem .6rem .5rem;
    color:var(--dim);
    font-size:.85em;
    min-height:1.6em;
    background:var(--panel);
  }
  .out b{color:var(--accent);font-weight:400;text-shadow:var(--glow)}
  .keys{
    padding:0 .6rem 1rem;
    color:var(--dim);
    font-size:.8em;
    line-height:1.7;
    background:var(--panel);
  }
  .keys summary{
    cursor:pointer;
    list-style:none;
    color:var(--dim);
    padding:.1rem 0 .2rem;
  }
  .keys summary::-webkit-details-marker{display:none}
  .keys summary::before{content:"[+] ";color:var(--faint)}
  .keys[open] summary::before{content:"[-] "}
  .keys summary:hover{color:var(--accent)}
  .keys kbd{font:inherit;color:var(--ink)}

  #files{
    display:none;
    padding:.5rem .6rem;
    border-top:1px solid var(--rule);
    background:var(--panel);
  }
  #files[data-open="true"]{display:block}
  .files__acciones{
    display:flex;
    gap:.5ch;
    flex-wrap:wrap;
    margin-bottom:.55rem;
  }
  .files__titulo{
    color:var(--faint);
    font-size:.78em;
    text-transform:uppercase;
    letter-spacing:.08em;
    padding-bottom:.15rem;
  }
  .files__item{
    all:unset;
    display:flex;
    gap:1ch;
    align-items:baseline;
    width:100%;
    box-sizing:border-box;
    cursor:pointer;
    font:inherit;
    font-size:.9em;
    color:var(--ink);
    padding:.12rem .4ch;
    border:1px solid transparent;
  }
  .files__item:hover{border-color:var(--accent);color:var(--accent)}
  .files__nombre{
    flex:1 1 auto;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .files__hace{color:var(--faint);white-space:nowrap;font-size:.9em}
  .files__vacio,.files__nota{
    color:var(--faint);
    font-size:.85em;
    padding:.15rem 0;
  }
  .files__nota{padding-top:.5rem}

  #raw{
    display:none;
    padding:.6rem;
    border-top:1px solid var(--rule);
    background:var(--panel);
  }
  #raw[data-open="true"]{display:block}
  #raw pre{
    margin:0 0 .5rem;
    padding:.5rem;
    max-height:40dvh;
    overflow:auto;
    border:1px solid var(--rule);
    background:var(--bg);
    color:var(--ink);
    font:inherit;
    font-size:.9em;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
  }
  /* ventanas angostas: menos margen y tipo mas chica, misma jerarquia */
  @media (max-width:30rem){
    :root{--gut:3.2ch}
    .line{padding-inline:.42rem}
    .bar{padding-inline:.42rem}
    .out{padding-inline:.42rem}
    .keys{padding-inline:.42rem}
    #files{padding-inline:.42rem}
    .kill{padding-left:.6ch}
  }
  @media (max-width:20rem){
    :root{--gut:3.1ch}
    .line{padding-inline:.3rem}
    .bar{padding-inline:.3rem}
    .out{padding-inline:.3rem}
    .keys{padding-inline:.3rem;padding-bottom:.6rem}
    #files{padding-inline:.3rem}
    .kill{padding-left:.7ch}
    .line--h1 .txt{font-size:1.1em}
    .line--h2{margin-top:.7rem}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div class="term">
  <header class="bar">
    <span class="name" id="fname">▓ chk.md</span><span class="caret">▌</span>
    <span class="spacer"></span>
    <span class="count" id="count">0/0</span>
    <span class="meter" id="meter"><span id="mFill"></span><span id="mRest"></span></span>
  </header>

  <main class="buf" id="buf"></main>

  <footer>
    <div id="files">
      <div class="files__acciones">
        <button class="btn" type="button" id="fOpen">abrir archivo…</button>
        <button class="btn" type="button" id="fSaveAs">guardar como…</button>
        <button class="btn" type="button" id="fCopy">descargar copia</button>
        <span class="spacer"></span>
        <button class="btn" type="button" id="fClose">cerrar</button>
      </div>
      <div class="files__titulo">recientes</div>
      <div id="recientes"></div>
      <div class="files__nota" id="fNota"></div>
    </div>
    <div class="bar bar--btm">
      <button class="btn" id="addItem" title="Nueva tarea (Enter)">+ [ ]</button>
      <button class="btn" id="addSec" title="Nueva sección">+ ##</button>
      <span class="spacer"></span>
      <button class="btn" type="button" id="archivo" title="Abrir un .md del disco, guardar como, recientes">archivo</button>
      <button class="btn btn--warn" id="wipe" title="Borrar todo">rm</button>
      <button class="btn btn--go" id="save" title="Guardar (Cmd+S)">↓ .md</button>
    </div>
    <div class="out" id="out"></div>
    <details class="keys" id="keys">
      <summary>teclas</summary>
      <div><kbd>Enter</kbd> nueva línea · <kbd>Tab</kbd> tarea↔sección · <kbd>Backspace</kbd> borra la vacía · <kbd>Alt+↑↓</kbd> mover · <kbd>Cmd+Enter</kbd> marcar · <kbd>Cmd+S</kbd> guarda en el archivo · pegar texto = importar lista</div>
    </details>
    <div id="raw">
      <pre id="rawText"></pre>
      <button class="btn" id="rawClose">cerrar</button>
    </div>
    <input type="file" id="fileInput" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
  </footer>
</div>

<script>
(function(){
  "use strict";
  var KEY="chk.md.doc.v2";
  var buf=document.getElementById("buf");
  var out=document.getElementById("out");
  var CE="plaintext-only";
  (function(){var t=document.createElement("div");try{t.contentEditable=CE;if(t.contentEditable!==CE)CE="true";}catch(e){CE="true";}})();

  function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}

  var doc=load()||{title:"",lines:[{id:uid(),type:"h2",text:""},{id:uid(),type:"item",text:"",done:false}]};

  function load(){
    try{
      var raw=localStorage.getItem(KEY);
      if(!raw)return null;
      var d=JSON.parse(raw);
      if(!d||!Array.isArray(d.lines))return null;
      d.title=typeof d.title==="string"?d.title:"";
      d.lines=d.lines.filter(function(l){return l&&(l.type==="h2"||l.type==="item");})
        .map(function(l){return{id:l.id||uid(),type:l.type,text:typeof l.text==="string"?l.text:"",done:!!l.done};});
      if(!d.lines.length)d.lines=[{id:uid(),type:"item",text:"",done:false}];
      return d;
    }catch(e){return null;}
  }
  var saveT;
  function guardarEstado(){
    try{localStorage.setItem(KEY,JSON.stringify({title:doc.title,lines:doc.lines,sucio:sucio}));}catch(e){}
  }
  function persist(){
    marcarSucio();
    clearTimeout(saveT);
    saveT=setTimeout(guardarEstado,250);
  }

  function idx(id){for(var i=0;i<doc.lines.length;i++)if(doc.lines[i].id===id)return i;return -1;}

  /* ── markdown ───────────────────────── */
  function toMd(){
    var o=[],t=(doc.title||"").trim()||"Checklist";
    o.push("# "+t,"");
    doc.lines.forEach(function(l){
      var s=(l.text||"").trim();
      if(l.type==="h2"){
        if(o.length&&o[o.length-1]!=="")o.push("");
        if(s)o.push("## "+s,"");
      }else if(s){
        o.push("- ["+(l.done?"x":" ")+"] "+s);
      }
    });
    return o.join("\n").replace(/\n{3,}/g,"\n\n").trim()+"\n";
  }
  function slug(){
    var s=(doc.title||"checklist").toLowerCase();
    s=s.normalize?s.normalize("NFD").replace(/[\u0300-\u036f]/g,""):s;
    s=s.replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,48);
    return (s||"checklist")+".md";
  }

  /* ── render ─────────────────────────── */
  function mkText(cls,val,ph){
    var d=document.createElement("div");
    d.className="txt";
    d.contentEditable=CE;
    d.spellcheck=false;
    d.setAttribute("data-ph",ph);
    d.textContent=val;
    return d;
  }
  function render(focusId,atEnd){
    buf.textContent="";

    var h1=document.createElement("div");
    h1.className="line line--h1";
    var tk=document.createElement("span");
    tk.className="tok";tk.textContent="#";
    var tx=mkText("","","título de la lista");
    tx.textContent=doc.title;
    tx.id="titleTxt";
    tx.setAttribute("aria-label","Título");
    tx.addEventListener("input",function(){
      doc.title=tx.textContent;
      pintarNombre();
      persist();
    });
    tx.addEventListener("keydown",function(e){
      if(e.key==="Enter"){e.preventDefault();focusLine(doc.lines[0]?doc.lines[0].id:add("item",0));}
    });
    tx.addEventListener("paste",onPaste(null));
    h1.appendChild(tk);h1.appendChild(tx);
    buf.appendChild(h1);

    doc.lines.forEach(function(l){
      var row=document.createElement("div");
      row.className="line line--"+l.type+(l.type==="item"&&l.done?" line--done":"");
      row.setAttribute("data-id",l.id);

      if(l.type==="item"){
        var b=document.createElement("button");
        b.className="box";
        b.type="button";
        b.setAttribute("role","checkbox");
        b.setAttribute("aria-checked",l.done?"true":"false");
        b.setAttribute("aria-label",l.done?"Desmarcar tarea":"Marcar tarea");
        b.textContent=l.done?"[x]":"[ ]";
        b.addEventListener("click",function(){toggle(l.id);});
        row.appendChild(b);
      }else{
        var s=document.createElement("span");
        s.className="tok";s.textContent="##";
        row.appendChild(s);
      }

      var t=mkText("",l.text,l.type==="h2"?"sección":"tarea");
      t.setAttribute("aria-label",l.type==="h2"?"Sección":"Tarea");
      t.addEventListener("input",function(){l.text=t.textContent;persist();});
      t.addEventListener("keydown",keys(l));
      t.addEventListener("paste",onPaste(l));
      row.appendChild(t);

      var k=document.createElement("button");
      k.className="kill";k.type="button";
      k.setAttribute("aria-label","Eliminar línea");
      k.textContent="×";
      k.addEventListener("click",function(){del(l.id);});
      row.appendChild(k);

      buf.appendChild(row);
    });

    tally();
    if(focusId==="title")focusEl(document.getElementById("titleTxt"),atEnd);
    else if(focusId)focusLine(focusId,atEnd);
  }

  function focusEl(el,atEnd){
    if(!el)return;
    el.focus();
    var sel=window.getSelection();
    if(!sel)return;
    var r=document.createRange();
    r.selectNodeContents(el);
    r.collapse(atEnd===false);
    sel.removeAllRanges();sel.addRange(r);
  }
  function focusLine(id,atEnd){
    var row=buf.querySelector('.line[data-id="'+id+'"]');
    if(row)focusEl(row.querySelector(".txt"),atEnd);
  }

  /* ── ops ────────────────────────────── */
  function add(type,at,text){
    var l={id:uid(),type:type,text:text||"",done:false};
    var i=(typeof at==="number"&&at>=0)?at:doc.lines.length;
    doc.lines.splice(i,0,l);
    persist();
    return l.id;
  }
  function del(id){
    var i=idx(id);if(i<0)return;
    doc.lines.splice(i,1);
    if(!doc.lines.length)doc.lines.push({id:uid(),type:"item",text:"",done:false});
    persist();
    var prev=doc.lines[Math.max(0,i-1)];
    render(prev?prev.id:"title",true);
  }
  function toggle(id){
    var l=doc.lines[idx(id)];if(!l||l.type!=="item")return;
    l.done=!l.done;persist();render();
  }
  function move(id,dir){
    var i=idx(id),j=i+dir;
    if(i<0||j<0||j>=doc.lines.length)return;
    var a=doc.lines[i];doc.lines[i]=doc.lines[j];doc.lines[j]=a;
    persist();render(id,true);
  }
  function retype(id,type){
    var l=doc.lines[idx(id)];if(!l)return;
    l.type=type;if(type==="h2")l.done=false;
    persist();render(id,true);
  }

  function keys(l){
    return function(e){
      var el=e.currentTarget;
      if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){
        e.preventDefault();
        if(l.type==="item")toggle(l.id);
        return;
      }
      if(e.key==="Enter"){
        e.preventDefault();
        l.text=el.textContent;
        render(add("item",idx(l.id)+1),true);
        return;
      }
      if(e.key==="Tab"){
        e.preventDefault();
        retype(l.id,l.type==="item"?"h2":"item");
        return;
      }
      if((e.key==="ArrowUp"||e.key==="ArrowDown")&&e.altKey){
        e.preventDefault();
        move(l.id,e.key==="ArrowUp"?-1:1);
        return;
      }
      if(e.key==="Backspace"&&el.textContent===""){
        e.preventDefault();
        del(l.id);
      }
    };
  }

  /* ── paste = importar ───────────────── */
  function parseLine(raw){
    var s=raw.replace(/\s+$/,"");
    var m=s.match(/^\s*#{1,6}\s+(.*)$/);
    if(m)return{type:"h2",text:m[1].trim(),done:false};
    m=s.match(/^\s*(?:[-*+]|\d+[.)])\s*\[([ xX])\]\s*(.*)$/);
    if(m)return{type:"item",text:m[2].trim(),done:m[1].toLowerCase()==="x"};
    m=s.match(/^\s*(?:[-*+]|\d+[.)])\s+(.*)$/);
    if(m)return{type:"item",text:m[1].trim(),done:false};
    return{type:"item",text:s.trim(),done:false};
  }
  function onPaste(l){
    return function(e){
      var txt=(e.clipboardData||window.clipboardData).getData("text");
      if(txt==null)return;
      e.preventDefault();
      if(!/[\r\n]/.test(txt)){
        insertText(txt);
        if(l){l.text=e.currentTarget.textContent;}else{doc.title=e.currentTarget.textContent;}
        persist();
        return;
      }
      var rows=txt.split(/\r\n|\r|\n/),parsed=[],i=0;
      if(!doc.title.trim()){
        for(;i<rows.length;i++){
          if(!rows[i].trim())continue;
          var h=rows[i].match(/^\s*#\s+(.*)$/);
          if(h){doc.title=h[1].trim();i++;}
          break;
        }
      }
      for(;i<rows.length;i++){
        if(!rows[i].trim())continue;
        var p=parseLine(rows[i]);
        p.id=uid();
        parsed.push(p);
      }
      if(!parsed.length){render(l?l.id:"title",true);return;}
      var at=l?idx(l.id):-1;
      if(l&&!(l.text||"").trim()){doc.lines.splice(at,1);}else{at=at+1;}
      if(at<0)at=0;
      Array.prototype.splice.apply(doc.lines,[at,0].concat(parsed));
      doc.lines=doc.lines.filter(function(x){return (x.text||"").trim()!=="";});
      if(!doc.lines.length)doc.lines=parsed;
      persist();
      render(parsed[parsed.length-1].id,true);
      say("importadas <b>"+parsed.length+"</b> líneas");
    };
  }
  function insertText(t){
    var sel=window.getSelection();
    if(!sel||!sel.rangeCount)return;
    var r=sel.getRangeAt(0);
    r.deleteContents();
    var n=document.createTextNode(t);
    r.insertNode(n);
    r.setStartAfter(n);r.collapse(true);
    sel.removeAllRanges();sel.addRange(r);
  }

  /* ── archivos locales ─────────────────
     Con la File System Access API se abre un .md del disco y Cmd+S escribe
     en ESE mismo archivo, sin crear copias. Donde no existe (Safari, Firefox)
     se importa con <input type=file> y al guardar se descarga una copia. */
  var FS=!!(window.showOpenFilePicker&&window.showSaveFilePicker);
  var DBN="chk.md.files";
  var fileHandle=null,fileName="",fileMtime=0,sucio=false;
  try{sucio=!!JSON.parse(localStorage.getItem(KEY)||"{}").sucio;}catch(e){}

  function dbAbrir(){
    return new Promise(function(res,rej){
      var req=indexedDB.open(DBN,1);
      req.onupgradeneeded=function(){req.result.createObjectStore("v");};
      req.onsuccess=function(){res(req.result);};
      req.onerror=function(){rej(req.error);};
    });
  }
  function dbGet(k){
    return dbAbrir().then(function(db){
      return new Promise(function(res,rej){
        var q=db.transaction("v","readonly").objectStore("v").get(k);
        q.onsuccess=function(){res(q.result);};
        q.onerror=function(){rej(q.error);};
      });
    }).catch(function(){return null;});
  }
  function dbSet(k,v){
    return dbAbrir().then(function(db){
      return new Promise(function(res,rej){
        var q=db.transaction("v","readwrite").objectStore("v").put(v,k);
        q.onsuccess=function(){res(true);};
        q.onerror=function(){rej(q.error);};
      });
    }).catch(function(){return false;});
  }
  function recordarReciente(h,n){
    return dbGet("recientes").then(function(lista){
      lista=Array.isArray(lista)?lista:[];
      lista=lista.filter(function(r){return r&&r.nombre!==n;});
      lista.unshift({handle:h,nombre:n,at:Date.now()});
      return dbSet("recientes",lista.slice(0,8));
    }).then(function(){
      return dbSet("actual",{handle:h,nombre:n});
    });
  }
  function hace(ts){
    var s=Math.max(0,(Date.now()-ts)/1000);
    if(s<90)return "ahora";
    if(s<3600)return "hace "+Math.round(s/60)+" min";
    if(s<86400)return "hace "+Math.round(s/3600)+" h";
    var d=Math.round(s/86400);
    return d===1?"ayer":"hace "+d+" d";
  }
  function pintarNombre(){
    var fn=document.getElementById("fname");
    if(fn)fn.textContent="▓ "+(fileHandle&&sucio?"● ":"")+(fileHandle?fileName:slug());
    var b=document.getElementById("save");
    if(!b)return;
    b.textContent=fileHandle?"guardar":(FS?"guardar…":"↓ .md");
    b.title=fileHandle?("Guardar en "+fileName+" (Cmd+S)"):(FS?"Guardar como… (Cmd+S)":"Descargar .md (Cmd+S)");
  }
  function marcarSucio(){
    if(!fileHandle||sucio)return;
    sucio=true;
    pintarNombre();
  }
  function cargarMd(txt){
    var rows=String(txt).replace(/^\uFEFF/,"").split(/\r\n|\r|\n/),t="",lineas=[],i=0;
    for(;i<rows.length;i++){
      if(!rows[i].trim())continue;
      var h=rows[i].match(/^\s*#\s+(.*)$/);
      if(h){t=h[1].trim();i++;}
      break;
    }
    for(;i<rows.length;i++){
      if(!rows[i].trim())continue;
      var pl=parseLine(rows[i]);
      pl.id=uid();
      lineas.push(pl);
    }
    if(!lineas.length)lineas=[{id:uid(),type:"item",text:"",done:false}];
    doc={title:t,lines:lineas};
    render();
  }
  function permiso(h){
    if(!h||!h.queryPermission)return Promise.resolve(true);
    return h.queryPermission({mode:"readwrite"}).then(function(p){
      if(p==="granted")return true;
      return h.requestPermission({mode:"readwrite"}).then(function(p2){return p2==="granted";});
    });
  }
  function usarHandle(h){
    return h.getFile().then(function(f){
      return f.text().then(function(txt){
        cargarMd(txt);
        fileHandle=h;
        fileName=f.name||h.name||"lista.md";
        fileMtime=f.lastModified||0;
        sucio=false;
        pintarNombre();
        guardarEstado();
        cerrarPanel();
        say("abierto <b>"+fileName+"</b>");
        return recordarReciente(h,fileName);
      });
    });
  }
  function abrirArchivo(){
    if(!FS){
      var inp=document.getElementById("fileInput");
      inp.value="";
      inp.click();
      return;
    }
    window.showOpenFilePicker({
      multiple:false,
      types:[{description:"Markdown",accept:{"text/markdown":[".md",".markdown"],"text/plain":[".txt"]}}]
    }).then(function(hs){return usarHandle(hs[0]);}).catch(function(e){
      if(e&&e.name==="AbortError")return;
      say("no se pudo abrir: "+((e&&(e.message||e.name))||"error"));
    });
  }
  function escribirEn(h,md){
    /* si el archivo cambio fuera de aquí, preguntar antes de pisarlo */
    return h.getFile().then(function(f){
      if(fileMtime&&f.lastModified>fileMtime+1500&&
         !window.confirm("El archivo cambió fuera de chk.md desde que lo abriste.\n\n¿Sobrescribirlo con lo que tienes aquí?")){
        return Promise.reject({name:"AbortError"});
      }
      return h.createWritable();
    }).then(function(w){
      return w.write(md).then(function(){return w.close();});
    }).then(function(){
      return h.getFile().then(function(f2){fileMtime=f2.lastModified||0;});
    });
  }
  function guardar(forzarDialogo){
    var md=toMd();
    if(!FS){
      var n=fileName||slug();
      if(download(md,n))say("este navegador no escribe en el archivo: se descargó <b>"+n+"</b>");
      else copyFallback(md,n);
      return;
    }
    var destino=(!forzarDialogo&&fileHandle)?Promise.resolve(fileHandle):window.showSaveFilePicker({
      suggestedName:fileName||slug(),
      types:[{description:"Markdown",accept:{"text/markdown":[".md"]}}]
    });
    destino.then(function(h){
      /* archivo recien elegido: no hay fecha previa con que comparar */
      if(h!==fileHandle)fileMtime=0;
      return permiso(h).then(function(ok){
        if(!ok){say("sin permiso para escribir en el archivo");return null;}
        return escribirEn(h,md).then(function(){
          fileHandle=h;
          fileName=h.name||fileName||slug();
          sucio=false;
          pintarNombre();
          guardarEstado();
          say("guardado en <b>"+fileName+"</b>");
          return recordarReciente(h,fileName);
        });
      });
    }).catch(function(e){
      if(e&&e.name==="AbortError")return;
      say("no se pudo guardar: "+((e&&(e.message||e.name))||"error"));
    });
  }
  function cerrarPanel(){
    var p=document.getElementById("files");
    if(p)p.removeAttribute("data-open");
  }
  function listarRecientes(){
    var cont=document.getElementById("recientes");
    cont.textContent="";
    document.getElementById("fNota").textContent=FS?"":
      "Este navegador no puede escribir en el archivo original: al guardar se descarga una copia. En Chrome, Edge o Helium sí escribe en el mismo archivo.";
    if(!FS)return;
    dbGet("recientes").then(function(lista){
      if(!Array.isArray(lista)||!lista.length){
        var v=document.createElement("div");
        v.className="files__vacio";
        v.textContent="todavía no has abierto archivos";
        cont.appendChild(v);
        return;
      }
      lista.forEach(function(r){
        var b=document.createElement("button");
        b.className="files__item";
        b.type="button";
        var n=document.createElement("span");
        n.className="files__nombre";
        n.textContent=r.nombre;
        var t=document.createElement("span");
        t.className="files__hace";
        t.textContent=hace(r.at);
        b.appendChild(n);
        b.appendChild(t);
        b.addEventListener("click",function(){
          permiso(r.handle).then(function(ok){
            if(!ok){say("sin permiso para abrir ese archivo");return null;}
            return usarHandle(r.handle);
          }).catch(function(){
            say("no se pudo abrir <b>"+r.nombre+"</b> (¿se movió o se borró?)");
          });
        });
        cont.appendChild(b);
      });
    });
  }

  /* ── tally ──────────────────────────── */
  function tally(){
    var items=doc.lines.filter(function(l){return l.type==="item"&&(l.text||"").trim();});
    var done=items.filter(function(l){return l.done;}).length;
    document.getElementById("count").textContent=done+"/"+items.length;
    var cells=8,fill=items.length?Math.round(done/items.length*cells):0,a="",b="";
    for(var i=0;i<cells;i++){if(i<fill)a+="█";else b+="\u00b7";}
    pintarNombre();
    document.getElementById("mFill").textContent=a;
    document.getElementById("mRest").textContent=b;
  }

  /* ── mensajes ───────────────────────── */
  var msgT;
  function say(html){
    out.innerHTML=html?"> "+html:"";
    clearTimeout(msgT);
    if(html)msgT=setTimeout(function(){out.textContent="";},5000);
  }

  /* ── descarga ───────────────────────── */
  var raw=document.getElementById("raw");
  function showRaw(md,note){
    document.getElementById("rawText").textContent=md;
    raw.setAttribute("data-open","true");
    say(note);
  }
  document.getElementById("rawClose").addEventListener("click",function(){
    raw.removeAttribute("data-open");
  });

  function download(md,name){
    try{
      var blob=new Blob([md],{type:"text/markdown;charset=utf-8"}),
          url=URL.createObjectURL(blob),
          a=document.createElement("a");
      a.href=url;a.download=name;a.rel="noopener";
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){
        if(a.parentNode)a.parentNode.removeChild(a);
        URL.revokeObjectURL(url);
      },1500);
      return true;
    }catch(e){return false;}
  }
  document.getElementById("save").addEventListener("click",function(){guardar(false);});
  document.addEventListener("keydown",function(e){
    if((e.metaKey||e.ctrlKey)&&(e.key||"").toLowerCase()==="s"){
      e.preventDefault();
      guardar(e.shiftKey);
    }
  });
  function copyFallback(md,name){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(md).then(function(){
        say("descarga bloqueada — <b>"+name+"</b> copiado al portapapeles");
      }).catch(function(){
        showRaw(md,"descarga bloqueada — copia el texto de abajo");
      });
    }else{
      showRaw(md,"no se puede descargar aquí — copia el texto de abajo");
    }
  }

  /* ── barra inferior ─────────────────── */
  document.getElementById("addItem").addEventListener("click",function(){
    render(add("item",doc.lines.length),true);
  });
  document.getElementById("addSec").addEventListener("click",function(){
    render(add("h2",doc.lines.length),true);
  });
  var wipe=document.getElementById("wipe"),armed=false,armT;
  wipe.addEventListener("click",function(){
    if(!armed){
      armed=true;
      wipe.textContent="rm ¿seguro?";
      say("pulsa otra vez para borrar todo");
      clearTimeout(armT);
      armT=setTimeout(function(){armed=false;wipe.textContent="rm";say("");},4000);
      return;
    }
    armed=false;clearTimeout(armT);wipe.textContent="rm";
    doc={title:"",lines:[{id:uid(),type:"item",text:"",done:false}]};
    persist();render("title",true);say("lista vacía");
  });

  /* ── panel de archivo ───────────────── */
  var panelBtn=document.getElementById("archivo");
  panelBtn.addEventListener("click",function(){
    var p=document.getElementById("files");
    if(p.getAttribute("data-open")==="true"){cerrarPanel();return;}
    p.setAttribute("data-open","true");
    listarRecientes();
  });
  document.getElementById("fOpen").addEventListener("click",abrirArchivo);
  document.getElementById("fSaveAs").addEventListener("click",function(){
    cerrarPanel();
    guardar(true);
  });
  document.getElementById("fCopy").addEventListener("click",function(){
    var md=toMd(),n=fileName||slug();
    cerrarPanel();
    if(download(md,n))say("copia descargada: <b>"+n+"</b>");
    else copyFallback(md,n);
  });
  document.getElementById("fClose").addEventListener("click",cerrarPanel);
  document.getElementById("fileInput").addEventListener("change",function(e){
    var f=e.target.files&&e.target.files[0];
    if(f)leerArchivoSuelto(f);
  });
  function leerArchivoSuelto(f){
    var r=new FileReader();
    r.onload=function(){
      cargarMd(String(r.result||""));
      fileHandle=null;
      fileName=f.name;
      fileMtime=f.lastModified||0;
      sucio=false;
      pintarNombre();
      guardarEstado();
      cerrarPanel();
      say("abierto <b>"+f.name+"</b> — al guardar se descarga una copia");
    };
    r.readAsText(f);
  }
  function tieneArchivos(e){
    var t=e.dataTransfer&&e.dataTransfer.types;
    if(!t)return false;
    return Array.prototype.indexOf.call(t,"Files")>=0;
  }
  document.addEventListener("dragover",function(e){
    if(tieneArchivos(e))e.preventDefault();
  });
  document.addEventListener("drop",function(e){
    if(!tieneArchivos(e))return;
    e.preventDefault();
    var it=e.dataTransfer.items&&e.dataTransfer.items[0];
    var f=e.dataTransfer.files&&e.dataTransfer.files[0];
    if(it&&it.getAsFileSystemHandle){
      it.getAsFileSystemHandle().then(function(h){
        if(h&&h.kind==="file")return usarHandle(h);
        if(f)leerArchivoSuelto(f);
      }).catch(function(){if(f)leerArchivoSuelto(f);});
      return;
    }
    if(f)leerArchivoSuelto(f);
  });
  window.addEventListener("beforeunload",function(e){
    if(fileHandle&&sucio){e.preventDefault();e.returnValue="";}
  });

  var keysBox=document.getElementById("keys");
  if(keysBox)keysBox.open=window.innerWidth>=480;

  render();
  /* solo se recupera el vinculo si hay lista: con todo vacío, un Cmd+S
     podría borrar el archivo del disco */
  var hayContenido=!!((doc.title||"").trim()||doc.lines.some(function(l){return (l.text||"").trim();}));
  if(FS&&hayContenido){
    dbGet("actual").then(function(a){
      if(!a||!a.handle)return;
      fileHandle=a.handle;
      fileName=a.nombre||"lista.md";
      pintarNombre();
    });
  }
})();
</script>

</body>
</html>
